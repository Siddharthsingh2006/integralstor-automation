name: IntegralStor Playwright Automation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "30 18 * * *"

jobs:
  integralstor-full-flow:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Run IntegralStor full flow
        env:
          INTEGRALSTOR_USER: ${{ secrets.INTEGRALSTOR_USER }}
          INTEGRALSTOR_PASSWORD: ${{ secrets.INTEGRALSTOR_PASSWORD }}
        run: |
          mkdir -p reports
          pytest -v tests/test_full_flow_dataset_inspect.py \
            --html=reports/integralstor_full_flow.html \
            --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integralstor-full-flow-report
          path: reports/integralstor_full_flow.html

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            screenshots/
            videos/
            traces/
          if-no-files-found: ignore
